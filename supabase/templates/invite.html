<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px;background:#f7f6f3;font-family:Arial,Helvetica,sans-serif;color:#1a1917;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e3e0d9;border-radius:10px;padding:32px;">
      <h1 style="margin:0 0 12px;font-size:22px;font-weight:600;">Crea tu cuenta</h1>
      <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#4a4843;">Te invitaron a usar la plataforma. Define tu contraseña para entrar a tu panel.</p>
      <a href="{{ if and .RedirectTo (ne .RedirectTo .SiteURL) }}{{ .RedirectTo }}{{ else }}{{ .SiteURL }}/auth/callback?src=email{{ end }}&token_hash={{ .TokenHash }}&type=invite" style="display:inline-block;background:#1a1917;color:#f7f6f3;text-decoration:none;font-size:14px;padding:10px 18px;border-radius:6px;">Definir contraseña</a>
      <p style="margin:24px 0 0;font-size:12px;color:#8a867d;">Si no lo pediste, ignora este correo.</p>
    </div>
  </body>
</html>
